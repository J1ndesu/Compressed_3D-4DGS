# YAML values override matching CLI options in main.py.
gaussian_dim: 4
time_duration: [0.0, 10.0]
num_pts: 300_0000  # 3,000,000 initial points when generating a point cloud.
num_pts_ratio: 1.0
rot_4d: True
force_sh_3d: True
batch_size: 4
exhaust_test: False
# start_checkpoint: "output/$dataset/chkpnt6000.pth"


ModelParams:
  sh_degree: 3
  # source_path: ".../$dataset"
  # model_path: "output/$dataset"
  images: "images"
  resolution: 1 # 1 keeps prepared images; 2 halves width and height again.
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0 
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 6_000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100 
  opacity_reset_interval: 30000
  densify_from_iter: 500 
  densify_until_iter: 15_000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.0002 / 40 
  densify_until_num_points: -1
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  lambda_motion: 0.0

  # Enable gates during training; remove low-mask points during validation.
  use_pruning: True
  use_sh_adaptive: True
  use_vq: False  # Reserved; no quantization implementation.

  lambda_static_mask: 0.0001
  lambda_dynamic_mask: 0.0002
  lambda_sh: 0.0002

  # Training Gaussian threshold; validation uses the separate phi_prune_* values.
  phi_threshold: 0.05
  phi_prune_dynamic: 0.05
  phi_prune_static: 0.05
  phi_prune_sh: 0.05

  # Gates start here; sparsity weights ramp over positive warmup intervals.
  gs_mask_start_iter: 4000
  gs_mask_warmup_iters_static: 1000
  gs_mask_warmup_iters_dynamic: 1000

  sh_mask_start_iter: 4500
  sh_mask_warmup_iters: 1000

  static_mask_lr: 0.005
  dynamic_mask_lr: 0.005
  sh_mask_lr: 0.005
  codebook_lr: 0.0
